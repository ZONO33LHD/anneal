name: secret-sync

# GitHub Secrets に登録した機密値を GCP Secret Manager の secret へ反映する。
#
# Terraform（secretmanager モジュール）は secret の「箱」だけを作り、値（version）は
# state に載せないため管理しない。値の投入をこのワークフローが担う。
#
# GitHub Secrets の変更はイベントを発火しないため、値を登録・更新したら手動で実行する
# （Actions タブ → secret-sync → Run workflow）。
#
# 同期対象（GitHub Secret 名 → Secret Manager secret 名）:
#   GEMINI_API_KEY         → GEMINI_API_KEY
#   ANNEAL_GH_TOKEN        → GITHUB_TOKEN          （GITHUB_ 始まりは GitHub 予約のため別名で登録）
#   ANNEAL_INTERNAL_TOKEN  → ANNEAL_INTERNAL_TOKEN
on:
  workflow_dispatch:
    inputs:
      redeploy:
        description: "新しい値を反映した場合、mount 済み secret を Cloud Run に取り込む"
        type: boolean
        default: true

# 同時実行を 1 本に制限し、version の競合を避ける。
concurrency:
  group: secret-sync
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGION: asia-northeast1
  SERVICE: anneal

jobs:
  sync:
    name: Sync secrets to Secret Manager
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check GCP auth config
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$GCP_PROJECT_ID" ] || [ -z "$GCP_WIF_PROVIDER" ] || [ -z "$GCP_SERVICE_ACCOUNT" ]; then
            echo "::error::GCP auth secrets (GCP_PROJECT_ID / GCP_WIF_PROVIDER / GCP_SERVICE_ACCOUNT) are required."
            exit 1
          fi

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          audience: https://github.com/${{ github.repository }}

      # 各 GitHub Secret を対応する Secret Manager secret に反映する。
      # 空の GitHub Secret や未作成の箱はスキップし、既存 latest と一致すれば version を
      # 増やさない（version 増殖と課金を避ける）。
      - name: Sync secrets
        id: sync
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GEMINI_API_KEY_VALUE: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN_VALUE: ${{ secrets.ANNEAL_GH_TOKEN }}
          ANNEAL_INTERNAL_TOKEN_VALUE: ${{ secrets.ANNEAL_INTERNAL_TOKEN }}
        run: |
          set -euo pipefail
          SYNCED=""

          sync_one() {
            local name="$1" value="$2"
            if [ -z "${value:-}" ]; then
              echo "::notice::GitHub secret for ${name} is empty; skipping."
              return 0
            fi
            if ! gcloud secrets describe "$name" --project "$PROJECT_ID" >/dev/null 2>&1; then
              echo "::warning::Secret Manager secret ${name} does not exist; skipping (apply secretmanager module first)."
              return 0
            fi
            local current
            current="$(gcloud secrets versions access latest --secret "$name" --project "$PROJECT_ID" 2>/dev/null || true)"
            if [ "$current" = "$value" ]; then
              echo "::notice::${name} already up to date; no new version added."
              return 0
            fi
            printf '%s' "$value" | gcloud secrets versions add "$name" --data-file=- --project "$PROJECT_ID"
            echo "::notice::Added a new version of ${name}."
            SYNCED="${SYNCED} ${name}"
          }

          sync_one GEMINI_API_KEY        "${GEMINI_API_KEY_VALUE:-}"
          sync_one GITHUB_TOKEN          "${GITHUB_TOKEN_VALUE:-}"
          sync_one ANNEAL_INTERNAL_TOKEN "${ANNEAL_INTERNAL_TOKEN_VALUE:-}"

          echo "synced=${SYNCED# }" >> "$GITHUB_OUTPUT"

      # value_source が version=latest を解決するのは新しい revision の作成時のため、
      # 更新した値のうち「現在 Cloud Run に mount 済み」の secret だけを再アサートして
      # 新 revision を作る（未 mount の secret を足すと terraform とずれるため除外）。
      - name: Redeploy Cloud Run to pick up rotated secrets
        if: ${{ inputs.redeploy && steps.sync.outputs.synced != '' }}
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          SYNCED: ${{ steps.sync.outputs.synced }}
        run: |
          set -euo pipefail
          if ! gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" >/dev/null 2>&1; then
            echo "::notice::Cloud Run service ${SERVICE} not provisioned yet; skipping redeploy (terraform apply will pick up latest)."
            exit 0
          fi
          mounted="$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" \
            --format='value(spec.template.spec.containers[0].env[].valueFrom.secretKeyRef.name)' | tr ';' '\n')"
          args=()
          for s in $SYNCED; do
            if echo "$mounted" | grep -qx "$s"; then
              args+=(--update-secrets "${s}=${s}:latest")
            fi
          done
          if [ ${#args[@]} -eq 0 ]; then
            echo "::notice::None of the rotated secrets are currently mounted; nothing to redeploy."
            exit 0
          fi
          gcloud run services update "$SERVICE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            "${args[@]}" \
            --quiet
