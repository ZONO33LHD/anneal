name: image-build

# main への push でコンテナイメージをビルドし、Artifact Registry へ push する。
# Cloud Run はここで push されたイメージ（:latest と :<sha>）を参照する。
# 初回ブートストラップ（cloudrun apply 前に :latest を用意する）や、Go 変更が無いときの
# 手動リビルドのため workflow_dispatch でも起動できる。
on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/image-build.yml'
  workflow_dispatch: {}

env:
  REGION: asia-northeast1
  REPOSITORY: cloudrun
  IMAGE: anneal
  SERVICE: anneal

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          audience: https://github.com/${{ github.repository }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push
        run: |
          IMAGE_BASE="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPOSITORY}/${IMAGE}"
          docker build -t "${IMAGE_BASE}:${GITHUB_SHA}" -t "${IMAGE_BASE}:latest" .
          docker push "${IMAGE_BASE}:${GITHUB_SHA}"
          docker push "${IMAGE_BASE}:latest"

      # Cloud Run サービスが既に存在する場合のみ、push した :<sha> をロールアウトする。
      # サービスは Terraform（cloudrun モジュール）が初回に作成するため、未作成の間は
      # スキップして build/push までを成功扱いにする。
      - name: Deploy to Cloud Run
        run: |
          IMAGE_BASE="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPOSITORY}/${IMAGE}"
          if gcloud run services describe "${SERVICE}" --region "${REGION}" --project "${{ secrets.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
            gcloud run deploy "${SERVICE}" \
              --image "${IMAGE_BASE}:${GITHUB_SHA}" \
              --region "${REGION}" \
              --project "${{ secrets.GCP_PROJECT_ID }}" \
              --quiet
          else
            echo "Cloud Run service '${SERVICE}' not provisioned yet; skipping deploy (run terraform cloudrun first)."
          fi
