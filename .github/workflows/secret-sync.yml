name: secret-sync

# GitHub Secrets に登録した機密値を GCP Secret Manager の secret へ反映する。
#
# Terraform（secretmanager モジュール）は secret の「箱」だけを作り、値（version）は
# state に載せないため管理しない。値の投入をこのワークフローが担う。
#
# GitHub Secrets の変更はイベントを発火しないため、値を登録・更新したら手動で実行する
# （Actions タブ → secret-sync → Run workflow）。
on:
  workflow_dispatch:
    inputs:
      redeploy:
        description: "新しい値を反映した場合に Cloud Run を再デプロイして latest を取り込む"
        type: boolean
        default: true

# 同時実行を 1 本に制限し、version の競合を避ける。
concurrency:
  group: secret-sync
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGION: asia-northeast1
  SERVICE: anneal

jobs:
  sync:
    name: Sync secrets to Secret Manager
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check GCP auth config
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$GCP_PROJECT_ID" ] || [ -z "$GCP_WIF_PROVIDER" ] || [ -z "$GCP_SERVICE_ACCOUNT" ]; then
            echo "::error::GCP auth secrets (GCP_PROJECT_ID / GCP_WIF_PROVIDER / GCP_SERVICE_ACCOUNT) are required."
            exit 1
          fi

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          audience: https://github.com/${{ github.repository }}

      # GitHub Secrets の GEMINI_API_KEY を Secret Manager の同名 secret に反映する。
      # 既存の latest と一致する場合は version を増やさない（version の増殖と課金を避ける）。
      - name: Sync GEMINI_API_KEY
        id: gemini
        env:
          SECRET_VALUE: ${{ secrets.GEMINI_API_KEY }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          NAME=GEMINI_API_KEY

          if [ -z "${SECRET_VALUE:-}" ]; then
            echo "::warning::GitHub secret ${NAME} is empty; skipping. Register it in repo Settings → Secrets, then re-run."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! gcloud secrets describe "$NAME" --project "$PROJECT_ID" >/dev/null 2>&1; then
            echo "::error::Secret Manager secret ${NAME} does not exist. Apply the terraform secretmanager module first."
            exit 1
          fi

          CURRENT="$(gcloud secrets versions access latest --secret "$NAME" --project "$PROJECT_ID" 2>/dev/null || true)"
          if [ "$CURRENT" = "$SECRET_VALUE" ]; then
            echo "::notice::${NAME} already up to date; no new version added."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s' "$SECRET_VALUE" | gcloud secrets versions add "$NAME" --data-file=- --project "$PROJECT_ID"
          echo "::notice::Added a new version of ${NAME}."
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # value_source が version=latest を解決するのは新しい revision の作成時のため、
      # 値を更新したら新 revision を作って取り込む。サービス未作成時（初回 terraform apply
      # 前）はスキップする（apply 時に latest を取り込む）。
      - name: Redeploy Cloud Run to pick up latest secret
        if: ${{ inputs.redeploy && steps.gemini.outputs.changed == 'true' }}
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          if gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" >/dev/null 2>&1; then
            # secret マッピングを latest に再アサートして新 revision を作る（Terraform 設定と同一のため drift しない）。
            gcloud run services update "$SERVICE" \
              --region "$REGION" \
              --project "$PROJECT_ID" \
              --update-secrets "GEMINI_API_KEY=GEMINI_API_KEY:latest" \
              --quiet
          else
            echo "::notice::Cloud Run service ${SERVICE} not provisioned yet; skipping redeploy (terraform apply will pick up latest)."
          fi
