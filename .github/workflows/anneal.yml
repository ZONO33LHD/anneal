# Anneal — 自己スキャン（dogfooding）ワークフロー
#
# anneal リポジトリ自身の依存を Anneal に定期スキャンさせる（push モデル）。
# examples/target-repo/.github/workflows/anneal.yml のテンプレートを適用したもの。
# cron（と手動）で Cloud Run の /internal/scan を叩き、この repo をスキャンさせる。
#
# 前提（リポジトリ設定・設定済み）:
#   - Variable  ANNEAL_URL   : Anneal の Cloud Run URL
#   - Secret    ANNEAL_TOKEN : 内部エンドポイントの共有トークン（Cloud Run 側 ANNEAL_INTERNAL_TOKEN と一致）
name: anneal
on:
  schedule:
    - cron: "0 3 * * *" # 毎日 03:00 UTC に依存をスキャン
  workflow_dispatch: {} # 手動実行も可
permissions:
  contents: read
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Anneal scan for this repository
        env:
          ANNEAL_URL: ${{ vars.ANNEAL_URL }}
          ANNEAL_TOKEN: ${{ secrets.ANNEAL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ANNEAL_URL:-}" ] || [ -z "${ANNEAL_TOKEN:-}" ]; then
            echo "ANNEAL_URL (variable) と ANNEAL_TOKEN (secret) を設定してください" >&2
            exit 1
          fi
          curl -sS --fail-with-body -X POST "${ANNEAL_URL%/}/internal/scan" \
            -H "X-Anneal-Internal-Token: ${ANNEAL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"repository\": \"${{ github.repository }}\"}"
